name: code_Quality 


on: 
    push: 
        branches:
          - main

jobs:
  validate:
    runs-on: ubuntu-latest
    # strategy:
    #       fail-fast: false
    #       matrix:
    #           node-version: [ 24 ]
    steps:
       - name: checkout code
         uses: actions/checkout@v4

       - name: Setup node
         uses: actions/setup-node@v6
         with:
          node-version: 20
       - name: Install dependencies
         run: npm install

       - name: Run ESLint
         run: npm run lint
         
       - name: Run security scan
         run: npm audit
       